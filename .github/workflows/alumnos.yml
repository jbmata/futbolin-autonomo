name: Alumnos frente a la camara

# La mesa sale de Medidas/mesa.json (FUTBOLIN_MESA=mesa, por defecto). Los runs 45218541671 y
# 45218541712 (23/11/2026) usaron una mesa intermedia que ya no existe; no comparar con ellos.
# Lo que sigue describe la ronda anterior (mesa sim).
# Segunda ronda de alumnos DAgger (sin PPO), con la compensacion de latencia ya activada por
# defecto. En la ronda anterior (run 45124636693) `compensado` quedo en -0,08 con una sola semilla
# y el profesor en +0,35. Aqui: (1) otras dos semillas con el profesor de estado real, para saber
# si ese -0,08 se repite; (2) tres alumnos que imitan a un profesor que decide con la bola que da
# la camara (--teacher-view camera). Cada trabajo tambien mide a ese profesor "con ojos del alumno":
# es el techo de lo que un heuristico puede hacer con la percepcion del robot.
# Se lanza subiendo un cambio a `.github/alumnos.txt` en la rama `train`.
on:
  workflow_dispatch:
  push:
    branches: [train]
    paths: [".github/alumnos.txt"]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8

jobs:
  alumno:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cad_s1, seed: 1, tv: real }
          - { name: cad_s2, seed: 2, tv: real }
          - { name: cad_s3, seed: 3, tv: real }
    env:
      FUTBOLIN_COMPENSAR: "1"
    defaults: { run: { working-directory: Modelo } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: Modelo/requirements.txt }
      - name: Instalar dependencias
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: DAgger
        run: |
          python dagger.py --teacher models/teacher/base_90.json --out models/${{ matrix.name }}/student \
            --workers 4 --rounds 8 --matches 64 --seed ${{ matrix.seed }} \
            --teacher-view ${{ matrix.tv }} | tee dagger.txt
      - name: Evaluar (200 partidos de 60 s)
        run: |
          python benchmark.py --matches 200 --seed 20000 --teacher models/teacher/base_90.json \
            models/${{ matrix.name }}/student | tee resultados.txt
          for s in 1 2; do
            python visualize.py --model models/${{ matrix.name }}/student --seconds 60 --seed $s --save partido_$s.html --no-open || true
          done
          { echo '```'; cat resultados.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: |
            Modelo/dagger.txt
            Modelo/resultados.txt
            Modelo/partido_*.html
            Modelo/models/${{ matrix.name }}/student.zip
