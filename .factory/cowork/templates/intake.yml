# intake.yml — forma máquina del cuestionario factory-init
#
# Generado por el cowork (Aura); leído por /factory-intake y /factory-init para NO volver a
# preguntar lo que ya está respondido. Rellena los campos que conozcas; deja "" o [] en blanco
# y la factoría los preguntará en la sesión de init.
#
# NUNCA incluyas secretos (contraseñas, tokens, claves API) en este fichero — va versionado.
# Los tokens van en .factory/sdd/secrets.env (git-ignorado).
#
# Generated by the cowork session (Aura); read by /factory-intake and /factory-init so the
# factory never re-asks answered questions. Leave "" or [] blank and the factory will ask
# during init. NEVER include secrets here — this file is committed to the repo.

# ── Identidad del proyecto ────────────────────────────────────────────────────
project_name: ""                # Nombre corto del proyecto / Short project name

one_line_idea: ""               # Una frase: qué construimos y para quién
                                # One sentence: what we build and for whom

problem_statement: ""           # El problema real que resuelve; quién lo sufre y cuándo
                                # The real problem it solves; who suffers it and when

# ── Usuarios y éxito ─────────────────────────────────────────────────────────
target_users: []                # Lista de tipos de usuario (ej: ["gestor de almacén", "cliente final"])
                                # List of user types (e.g. ["warehouse manager", "end customer"])

success_criteria: []            # 2-4 criterios MEDIBLES — la stop condition del bucle de build
                                # 2-4 MEASURABLE criteria — the build loop's stop condition
                                # Ejemplo / Example:
                                #   - "El usuario puede registrarse y completar su primer pedido en < 3 min"
                                #   - "Tasa de error HTTP < 1 % en 100 peticiones de humo"

non_goals: []                   # Fuera de alcance explícito — lo que NO construimos ahora
                                # Explicit out-of-scope — what we are NOT building now
                                # Ejemplo / Example:
                                #   - "App móvil nativa (fase 2+)"
                                #   - "Integración con ERP heredado"

# ── Técnica y despliegue ──────────────────────────────────────────────────────
stack: ""                       # Stack detectado o elegido; "" si aún no se sabe
                                # Detected or chosen stack; "" if unknown yet
                                # Ejemplos / Examples: "FastAPI + React + Postgres", "Next.js + Supabase"

deploy_target: undecided        # Destino de despliegue / Deployment target
                                # local | vps | registry | undecided

# ── Motor SDD y tracker ───────────────────────────────────────────────────────
mode: checkpoint                # Modo de operación de la factoría / Factory operation mode
                                # checkpoint (pausa en cada fase — defecto) | autonomous
                                # | ultra-autonomous (no pregunta; deja las dudas en PENDIENTES.md)

sdd_engine: gsd                 # Motor de fases y metaprompting / Phase & metaprompting engine
                                # gsd | spec-kit

speckit_extensions: []          # Solo si sdd_engine: spec-kit — extensiones a habilitar
                                # Only if sdd_engine: spec-kit — extensions to enable
                                # Ejemplo / Example: ["quality-gates", "adr"]

tracker_platform: github        # Plataforma de issues / Issue tracker platform
                                # github | azure-devops

# ── Identidad del tracker ─────────────────────────────────────────────────────
github_repo: ""                 # owner/nombre del repo GitHub (ej: "acme/mi-app")
                                # GitHub repo owner/name (e.g. "acme/my-app")

azure_devops:                   # Solo si tracker_platform: azure-devops
  org: ""                       #   Nombre de la organización (ej: "contoso")
                                #   Organization name (e.g. "contoso")
  project: ""                   #   Nombre del proyecto Azure DevOps / Azure DevOps project name
  area_path: ""                 #   Ruta de área opcional / Optional area path (e.g. "MyProject\\Backend")

# ── Arranque ──────────────────────────────────────────────────────────────────
starterkit: null                # Starterkit elegido / Chosen starterkit
                                # fastapi | opensaas | frappe | go-service | none | null (null = no decidido aún)

model_tier_preference: balanced # Pista para el bloque models de config.yml / Hint for models block
                                # cost (execution en haiku) | balanced (sonnet, defecto) | quality (sonnet; opus solo por escalado)

# ── Señales brownfield ────────────────────────────────────────────────────────
brownfield_signals: []          # Pantallas o diseños marcados "lo que ya existe" en el cowork
                                # Screens or designs tagged "what already exists" in the cowork session
                                # Estos indican que hay código previo que la factoría debe respetar.
                                # These signal prior code the factory must preserve and work around.
                                # Ejemplo / Example:
                                #   - "Pantalla de login (captura login-actual.png) — ya existe"
                                #   - "Dashboard de ventas — parcialmente implementado"
